[pytest]
# This suite stubs PyQt6 itself (see tests/conftest.py) to test ui.py
# headlessly; pytest-qt's own PyQt6 auto-detection conflicts with those
# stubs when pytest-qt happens to be installed in the environment (it is
# not part of this project's own dependencies or CI). Disable it so the
# suite behaves the same whether or not pytest-qt is present locally.
addopts = -p no:pytest-qt
